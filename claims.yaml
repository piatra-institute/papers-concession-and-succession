- id: src-baseline
  kind: source
  passage: An original dataset of major resistance campaigns between 1900 and 2006 showed that nonviolent
    campaigns achieved maximalist objectives more often than armed ones, and attributed the difference
    to broader participation and to loyalty shifts among the opponent's security forces, whereas armed
    campaigns mobilised fewer people and gave the opponent a justification for violent counterattack [@stephan2008].
  evidence:
    citation_id: stephan2008
    locator: Abstract
    verified: true
    verification_note: Abstract retrieved through Crossref and read in full. It states the 1900-2006 range,
      the comparative success finding, and the participation and loyalty-shift mechanisms attributed here.
- id: src-armed-flank
  kind: source
  passage: Contemporaneous armed struggle does not improve the outcomes of unarmed campaigns and is negatively
    associated with participation and thereby with success [@chenoweth2015].
  evidence:
    citation_id: chenoweth2015
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states the null direct effect and the indirect negative
      effect operating through popular participation.
- id: src-defection
  kind: source
  passage: Security-force defection strongly influences the outcome of nonviolent uprisings, and troops
    who receive benefits from the regime, or who believe that it can survive, do not defect [@nepstad2013].
  evidence:
    citation_id: nepstad2013
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states both conditions attributed here, regime benefits
      to troops and perceived regime fragility.
- id: src-pillars
  kind: source
  passage: An agent-based model reaches a similar conclusion by a different method, finding that targeting
    the regime's pillars of support produces more defections than rapid mass recruitment, even for small
    campaigns [@chenoweth2022dynamic].
  evidence:
    citation_id: chenoweth2022dynamic
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; open access. It states that targeting pillars outperforms
      rapid recruitment at generating defections, including for small campaigns.
- id: src-autocratic-transitions
  kind: source
  passage: Of the 280 autocratic regimes in existence between 1946 and 2010, transitions from one autocracy
    to another account for about half of all regime changes [@geddes2014], and many of the resulting regimes
    are hybrids [@levitsky2010].
  evidence:
    citation_id: geddes2014
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states the 280 regimes, the 1946-2010 range, and that
      autocracy-to-autocracy transitions are about half of all regime changes.
- id: src-mobilization-durability
  kind: source
  passage: 'For accountability the evidence favours mobilisation: across 112 young democracies in 80 countries,
    democracies that emerged from mass mobilisation survived longer, and sustained unarmed uprisings produced
    the longest-lasting ones, because such campaigns build organisations that supply a leadership cadre,
    link government to society and constrain the post-transition government [@kadivar2018].'
  evidence:
    citation_id: kadivar2018
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states 112 young democracies in 80 countries, that longer
      mobilization predicts survival, and the organizational-structure mechanism.
- id: src-revolutionary-violence
  kind: source
  passage: 'For survival the evidence points the other way: violent revolutions are less likely to be
    reversed because they produce regimes with strong and loyal armies, and violence lowers the likelihood
    of counterrevolutionary success without lowering the likelihood of counterrevolutionary emergence
    [@clarke2022].'
  evidence:
    citation_id: clarke2022
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states the strong-and-loyal-army mechanism and the distinction
      between counterrevolutionary success and emergence.
- id: src-escalation-conditions
  kind: source
  passage: Movements are coalitions of factions, and escalation is more likely when a movement contains
    violence-wielding factions and nonviolent tactics are failing [@ryckman2019].
  evidence:
    citation_id: ryckman2019
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states the non-unitary-actor premise, the violence-wielding-faction
      argument, and the failure-of-nonviolent-channels condition.
- id: src-exit-fear
  kind: source
  passage: This term follows the finding that leaders concede more readily when the consequences of losing
    office are less severe [@debs2010].
  evidence:
    citation_id: debs2010
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states that less punitive consequences of losing office
      make a leader more willing to concede.
- id: src-endogeneity
  kind: source
  passage: 'The empirical literature makes a related point: dissent and repression are endogenous, and
    where a government represses preventively, observed dissent does not predict responsive repression
    [@ritter2016].'
  evidence:
    citation_id: ritter2016
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states that observed dissent does not meaningfully predict
      responsive repression where governments repress preventively. A 2024 corrigendum exists; no numeric
      result from the article is used.
- id: src-repression-instruments
  kind: source
  passage: 'This is consistent with evidence that different repressive instruments serve different purposes:
    political terror suppresses organised threats, restrictions on civil liberties deter collective action,
    and the two have different effects on how a dictator eventually leaves office [@escriba2013].'
  evidence:
    citation_id: escriba2013
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states that political terror reduces nonviolent and regular
      exits while restrictions on civil liberties deter both threat types.
- id: src-radical-flank
  kind: source
  passage: In two experiments with 2,772 participants, the presence of a radical flank increased support
    for a moderate faction of the same movement; the effect was driven by radical tactics such as property
    destruction or violence, and its mechanism was contrast, with the moderate faction appearing less
    radical [@simpson2022].
  evidence:
    citation_id: simpson2022
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; open access. It states N = 2,772 across two experiments,
      the tactics-not-agenda finding, and the contrast mechanism.
- id: src-backfire
  kind: source
  passage: 'Repression can backfire and increase mobilisation: whether repression of unarmed protest backfires
    depends on pre-existing campaign infrastructure and parallel media, which raise both domestic mobilisation
    and security defections after violent repression [@sutton2014; @hess2006], and exposure to a regime''s
    past repression can increase later participation [@lawrence2016].'
  evidence:
    citation_id: sutton2014
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states that pre-existing campaign infrastructure raises
      domestic mobilization and security defections after violent repression. The companion citation to
      hess2006 in the same sentence supports the construct only; no abstract was available for it through
      Crossref.
- id: src-concession-from-strength
  kind: source
  passage: The model also omits concession from strength, in which a ruling party accepts democratisation
    because it expects to keep winning elections [@slater2013]; the incumbent here concedes only when
    concession is the cheapest of three options.
  evidence:
    citation_id: slater2013
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states the conceding-to-thrive scenario and its three
      conditions.
- id: assume-stipulated-forms
  kind: assumption
  passage: 'The functional forms are stipulated: exponential retention, a multiplicative accountability
    term, an additive cost structure for the incumbent''s decision and a hazard form for removal.'
  rationale: Every functional form in the model is chosen for transparency, not estimated. The ensemble
    in the previous section perturbs the constants but not the forms, so the reported magnitudes are properties
    of these choices. Changing a form could change the magnitudes and, for a sufficiently different accountability
    function, the direction of the third result.
- id: assume-differential-sensitivity
  kind: assumption
  passage: The difference in sensitivity to repression between clandestine and open organisations drives
    the attrition results, and we found no empirical estimate of it.
  rationale: The two retention sensitivities, 0.28 for the armed wing and 0.60 for the civilian wing,
    are stipulated. No empirical estimate was found in the search recorded in research.md. The direction
    of the composition shift follows from the organizational argument; every magnitude in that section
    is a function of the ratio between these two numbers.
- id: assume-closed-form-tolerance
  kind: assumption
  passage: The expression was checked against period-by-period iteration; the invariant requires agreement
    to within $10^{-9}$, and the observed discrepancy is at the level of double-precision rounding.
  rationale: The invariant enforces agreement within 1e-9 between the closed form and the period-by-period
    iteration. The largest disagreement actually observed in the recorded run is 3.33067e-16, at /attrition/closed_form_max_error
    in simulation/output/results.json, which is double-precision rounding rather than a modelling discrepancy.
- id: assume-ensemble-perturbation
  kind: assumption
  passage: Each constant was multiplied by an independent uniform factor between 0.6 and 1.4, the institutional
    setting was drawn at random, and the analysis was repeated.
  rationale: A uniform factor in [0.6, 1.4] applied independently to each constant is a stipulated perturbation
    scale, wide enough to break a knife-edge result and narrow enough to keep the model interpretable.
    It is not a posterior and carries no probabilistic interpretation.
- id: define-escalation
  kind: definition
  passage: 'In the model, escalation means two things at once: the campaign shifts its own composition
    toward an armed wing, and that shift draws heavier repression.'
  rationale: 'Stipulative definition internal to the model. Escalation is one scalar driving two coupled
    changes: the campaign shifts its own initial composition toward an armed wing, and repression intensity
    rises. It is not a measurement of any campaign and does not correspond to any coding rule in NAVCO
    or any other dataset.'
- id: define-strippable-cooperation
  kind: definition
  passage: The institutional setting is summarised by one quantity, the share of the apparatus's cooperation
    that an intact civilian campaign could withdraw.
  rationale: Stipulative definition. The whole institutional environment is compressed into one scalar,
    the cooperation an intact civilian campaign could withdraw from the apparatus. The named real-world
    sources of insulation are offered as interpretation of the parameter, not as separately modelled mechanisms.
- id: interpret-localised-not-overturned
  kind: interpretation
  passage: This reproduces the empirical finding that escalation is generally counterproductive and identifies
    the narrow set of conditions in which it is not.
  rationale: An interpretation of the sweep, not an additional result. The model was built so that the
    civilian route to removal usually dominates, which is what the cited empirical literature reports;
    the contribution is the location of the exception, not a revision of the general finding. A reader
    who rejects the baseline would reject the calibration of the removal hazard as well.
- id: interpret-not-advice
  kind: normative
  passage: 'It is not advice: a decision about escalation concerns a particular apparatus, particular
    factions and particular consequences, none of which the model contains.'
  rationale: A normative limit the authors place on the work. The model prices a trade-off between three
    outcomes and takes no position on which outcome anyone should weigh most heavily, or on what any person
    facing an actual incumbent should do. No parameter here was estimated from any case.
- id: interpret-flank-measures-another-quantity
  kind: interpretation
  passage: Third-party support for a faction is distinct from the campaign's organisational capacity and
    from the character of the successor regime.
  rationale: An interpretation of the relationship between simpson2022 and this model, not a criticism
    of that work and not a result. The experiments measure third-party attitudes toward a faction; the
    model tracks surviving organizational capacity and the character of a successor. The two are compatible,
    and the paper claims only that they are different quantities.
