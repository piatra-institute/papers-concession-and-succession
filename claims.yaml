- id: src-baseline
  kind: source
  passage: 'An original dataset of major resistance campaigns between 1900 and 2006 established that nonviolent
    campaigns outperformed armed ones at achieving maximalist objectives, and proposed a mechanism: nonviolent
    campaigns attract broader participation and prompt loyalty shifts among the opponent''s security forces,
    while armed campaigns mobilize comparatively few people and hand the opponent a justification for
    violent counterattack [@stephan2008].'
  evidence:
    citation_id: stephan2008
    locator: Abstract
    verified: true
    verification_note: Abstract retrieved through Crossref and read in full. It states the 1900-2006 range,
      the comparative success finding, and the participation and loyalty-shift mechanisms attributed here.
- id: src-armed-flank
  kind: source
  passage: A companion result found that contemporaneous armed struggle does not improve an unarmed campaign's
    outcomes, and is negatively associated with popular participation and thereby with success [@chenoweth2015].
  evidence:
    citation_id: chenoweth2015
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states the null direct effect and the indirect negative
      effect operating through popular participation.
- id: src-defection
  kind: source
  passage: 'The proximate mechanism has been studied on its own: security-force defection heavily influences
    the outcome of nonviolent uprisings, and troops who receive benefits from the regime, or who believe
    the regime can survive the uprising, do not defect [@nepstad2013].'
  evidence:
    citation_id: nepstad2013
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states both conditions attributed here, regime benefits
      to troops and perceived regime fragility.
- id: src-pillars
  kind: source
  passage: An agent-based treatment arrives at the same place by a different route, finding that targeting
    the regime's pillars of support generates more defections than rapid mass recruitment, even for small
    campaigns [@chenoweth2022dynamic].
  evidence:
    citation_id: chenoweth2022dynamic
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; open access. It states that targeting pillars outperforms
      rapid recruitment at generating defections, including for small campaigns.
- id: src-autocratic-transitions
  kind: source
  passage: Of the 280 autocratic regimes in existence between 1946 and 2010, transitions from one autocracy
    to another make up about half of all regime changes [@geddes2014], and a large literature describes
    the hybrid regimes that have resulted [@levitsky2010].
  evidence:
    citation_id: geddes2014
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states the 280 regimes, the 1946-2010 range, and that
      autocracy-to-autocracy transitions are about half of all regime changes.
- id: src-mobilization-durability
  kind: source
  passage: 'On one of them the evidence favours mobilization: across 112 young democracies in 80 countries,
    new democracies growing out of mass mobilization survive longer, and sustained *unarmed* uprisings
    produce the longest-lasting ones, because such campaigns are forced to build an organizational structure
    that supplies a leadership cadre, links government to society, and constrains the post-transition
    government [@kadivar2018].'
  evidence:
    citation_id: kadivar2018
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states 112 young democracies in 80 countries, that longer
      mobilization predicts survival, and the organizational-structure mechanism.
- id: src-revolutionary-violence
  kind: source
  passage: 'On the other the evidence runs the other way: violent revolutions are less likely to be reversed,
    because they produce regimes with strong and loyal armies, and violence lowers the likelihood of counterrevolutionary
    success without lowering the likelihood of counterrevolutionary emergence [@clarke2022].'
  evidence:
    citation_id: clarke2022
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states the strong-and-loyal-army mechanism and the distinction
      between counterrevolutionary success and emergence.
- id: src-escalation-conditions
  kind: source
  passage: 'That decision is not hypothetical: movements are collections of factions rather than unitary
    actors, and escalation is likely when a movement contains violence-wielding factions and the campaign
    is failing to make progress through nonviolent channels [@ryckman2019].'
  evidence:
    citation_id: ryckman2019
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states the non-unitary-actor premise, the violence-wielding-faction
      argument, and the failure-of-nonviolent-channels condition.
- id: src-exit-fear
  kind: source
  passage: 'This is the one place the model borrows a result rather than stipulating a shape: the less
    punitive the consequences of losing office, the more a leader will concede to strike a bargain [@debs2010].'
  evidence:
    citation_id: debs2010
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states that less punitive consequences of losing office
      make a leader more willing to concede.
- id: src-endogeneity
  kind: source
  passage: 'This is the model''s version of a caution the empirical literature has already issued from
    the other side: dissent and repression are endogenous, and where a government represses preventively,
    observed dissent does not predict responsive repression [@ritter2016].'
  evidence:
    citation_id: ritter2016
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states that observed dissent does not meaningfully predict
      responsive repression where governments repress preventively. A 2024 corrigendum exists; no numeric
      result from the article is used.
- id: src-repression-instruments
  kind: source
  passage: 'This is consistent with the finding that different instruments do different work for a ruler:
    political terror suppresses organized threats while restrictions on civil liberties deter collective
    action, and the two have different effects on how a dictator eventually leaves [@escriba2013].'
  evidence:
    citation_id: escriba2013
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states that political terror reduces nonviolent and regular
      exits while restrictions on civil liberties deter both threat types.
- id: src-radical-flank
  kind: source
  passage: 'Two experiments with 2,772 participants found that the presence of a radical flank increases
    support for a moderate faction in the same movement, that it is radical tactics rather than a radical
    agenda that produces the effect, and that the mechanism is contrast: the moderate faction appears
    less radical [@simpson2022], an effect first proposed decades earlier [@haines1984].'
  evidence:
    citation_id: simpson2022
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; open access. It states N = 2,772 across two experiments,
      the tactics-not-agenda finding, and the contrast mechanism.
- id: src-backfire
  kind: source
  passage: 'Repression that backfires, mobilizing more people than it removes, is not in the model, and
    it is well documented: whether repression of unarmed protest backfires depends on pre-existing campaign
    infrastructure and parallel media, which raise both domestic mobilization and security defections
    after violent repression [@sutton2014; @hess2006], and exposure to a regime''s past repression can
    raise later participation [@lawrence2016].'
  evidence:
    citation_id: sutton2014
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states that pre-existing campaign infrastructure raises
      domestic mobilization and security defections after violent repression. The companion citation to
      hess2006 in the same sentence supports the construct only; no abstract was available for it through
      Crossref.
- id: src-concession-from-strength
  kind: source
  passage: Also absent is concession from strength, in which a ruling party embraces democratization because
    it expects to keep winning [@slater2013].
  evidence:
    citation_id: slater2013
    locator: Abstract
    verified: true
    verification_note: Abstract read in full; it states the conceding-to-thrive scenario and its three
      conditions.
- id: assume-stipulated-forms
  kind: assumption
  passage: The exponential retention, the multiplicative accountability term, the additive cost structure
    of the incumbent's decision and the hazard form of removal are choices, made to be transparent rather
    than because any of them was estimated.
  rationale: Every functional form in the model is chosen for transparency, not estimated. The ensemble
    in the previous section perturbs the constants but not the forms, so the reported magnitudes are properties
    of these choices. Changing a form could change the magnitudes and, for a sufficiently different accountability
    function, the direction of the third result.
- id: assume-differential-sensitivity
  kind: assumption
  passage: The differential sensitivity of clandestine and open organizations to repression is the parameter
    the second section rests on, and no empirical estimate of it was found.
  rationale: The two retention sensitivities, 0.28 for the armed wing and 0.60 for the civilian wing,
    are stipulated. No empirical estimate was found in the search recorded in research.md. The direction
    of the composition shift follows from the organizational argument; every magnitude in that section
    is a function of the ratio between these two numbers.
- id: assume-closed-form-tolerance
  kind: assumption
  passage: This is verified against period-by-period iteration; the invariant requires agreement to within
    $10^{-9}$ and the observed disagreement is at the level of double-precision rounding.
  rationale: The invariant enforces agreement within 1e-9 between the closed form and the period-by-period
    iteration. The largest disagreement actually observed in the recorded run is 3.33067e-16, at /attrition/closed_form_max_error
    in simulation/output/results.json, which is double-precision rounding rather than a modelling discrepancy.
- id: assume-ensemble-perturbation
  kind: assumption
  passage: Every constant is perturbed by an independent uniform factor between 0.6 and 1.4, the institutional
    condition is drawn at random, and the whole analysis is rerun.
  rationale: A uniform factor in [0.6, 1.4] applied independently to each constant is a stipulated perturbation
    scale, wide enough to break a knife-edge result and narrow enough to keep the model interpretable.
    It is not a posterior and carries no probabilistic interpretation.
- id: define-escalation
  kind: definition
  passage: 'Escalation in the model means two things together: the campaign deliberately shifts its own
    composition toward an armed wing, and that shift draws heavier repression.'
  rationale: 'Stipulative definition internal to the model. Escalation is one scalar driving two coupled
    changes: the campaign shifts its own initial composition toward an armed wing, and repression intensity
    rises. It is not a measurement of any campaign and does not correspond to any coding rule in NAVCO
    or any other dataset.'
- id: define-strippable-cooperation
  kind: definition
  passage: 'The institutional condition is reduced to a single interpretable quantity: how much of the
    apparatus''s cooperation an intact civilian campaign could strip.'
  rationale: Stipulative definition. The whole institutional environment is compressed into one scalar,
    the cooperation an intact civilian campaign could withdraw from the apparatus. The named real-world
    sources of insulation are offered as interpretation of the parameter, not as separately modelled mechanisms.
- id: interpret-localised-not-overturned
  kind: interpretation
  passage: 'This is the model reproducing the empirical baseline it was built to respect, and it should
    be read that way: the general finding that escalation is counterproductive is not overturned here,
    it is localized.'
  rationale: An interpretation of the sweep, not an additional result. The model was built so that the
    civilian route to removal usually dominates, which is what the cited empirical literature reports;
    the contribution is the location of the exception, not a revision of the general finding. A reader
    who rejects the baseline would reject the calibration of the removal hazard as well.
- id: interpret-not-advice
  kind: normative
  passage: It is not advice.
  rationale: A normative limit the authors place on the work. The model prices a trade-off between three
    outcomes and takes no position on which outcome anyone should weigh most heavily, or on what any person
    facing an actual incumbent should do. No parameter here was estimated from any case.
- id: interpret-flank-measures-another-quantity
  kind: interpretation
  passage: Third-party support for a faction is not the campaign's organizational capacity, and neither
