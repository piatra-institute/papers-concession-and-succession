web_blurb: Nonviolent campaigns unseat rulers more often; armed revolutions that succeed resist counterrevolution;
  sustained unarmed mobilization is what produces successors that answer to anyone. Coupling the three
  in one model finds that where escalation improves the odds of removal, it costs almost all of the accountable
  succession.
