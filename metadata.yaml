web_blurb: Nonviolent campaigns remove rulers more often, while armed revolutions that succeed are reversed
  less often. A model combining both findings shows that escalation raises the chance of removal only
  in a narrow range of conditions, and in that range it sharply lowers the chance of an accountable successor.
